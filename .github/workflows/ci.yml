name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install numpy
      # test_repo.py checks rules shared with the wheel skill, which lives upstream.
      - run: git clone --depth 1 https://github.com/royalskynet/wheel-it "$HOME/dev/wheel"

      # test_router.py needs the intent model; download once, then reuse.
      - uses: actions/cache@v6
        with:
          path: router/model
          key: genie-model-${{ hashFiles('router/setup_model.py') }}
      - run: '[ -f router/model/vocab.json ] || python router/setup_model.py'

      - name: shell syntax
        run: bash -n install.sh update.sh claude/session_start.sh
      - name: python tests
        env:
          GENIE_STATE_DIR: ${{ runner.temp }}/genie-state
        run: |
          set -e
          for t in router/test_*.py tests/test_install.py; do
            echo "== $t"
            python "$t"
          done
      - name: opencode tests
        run: node --test opencode/*.test.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
